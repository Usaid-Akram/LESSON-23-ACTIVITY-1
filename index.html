
<!DOCTYPE html>
<html>
<head>
    <title>My Phone Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-4">
        <h1>My Phone Contact</h1>
        <p>My contact details are shown below.</p>

        <div class="card">
            <div class="card-body">
                <p><b>Name:</b> <span id="name"></span></p>
                <p><b>Phone:</b> <span id="phone"></span></p>
                <p><b>School:</b> <span id="school"></span></p>
                <p><b>City:</b> <span id="city"></span></p>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-body">
                <h5>JavaScript Code</h5>
                <pre id="codeDisplay"></pre>
            </div>
        </div>
    </div>

    <script>
        var myContact = {
            name: "Usaid Akram",
            phone: "03001234567",
            school: "My School",
            city: "Gujranwala, Punjab"
        };

        document.getElementById("name").textContent = myContact.name;
        document.getElementById("phone").textContent = myContact.phone;

        document.getElementById("school").textContent = myContact["school"];
        document.getElementById("city").textContent = myContact["city"];

        document.getElementById("codeDisplay").textContent =
            'var myContact = {\n' +
            '  name: "Usaid Akram",\n' +
            '  phone: "03001234567",\n' +
            '  school: "My School",\n' +
            '  city: "Gujranwala, Punjab"\n' +
            '};';
    </script>

    <footer>
        <p>My Phone Contact</p>
    </footer>

</body>
</html>
